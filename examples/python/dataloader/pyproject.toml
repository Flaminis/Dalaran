[project]
name = "dataloader"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dalaran-sdk[dataloader,catalog,tracing]",
  "huggingface-hub>=1.0",
  "lerobot[dataset]==0.6.0",
]

[dependency-groups]
dev = ["mypy==1.19.1"]

[tool.dalaran-example]
# Picked up by scripts/ci/isolated_examples.py and the `py-lint-isolated-examples` pixi task.
isolated = true

[tool.uv]
# The example is flat scripts, not a wheel — skip project build, just sync deps.
package = false
# pyarrow 24.0.0 segfaults dalaran on import and ships an incomplete py.typed that breaks mypy.
# Isolated examples don't inherit the workspace root's constraint-dependencies, so pin it here.
# pyarrow arrives transitively (via dalaran-sdk), hence a constraint rather than a direct dependency.
constraint-dependencies = ["pyarrow>=23.0.1,<24"]

# Default `uv sync` uses the in-repo editable dalaran-sdk (monorepo dev mode).
# After syncing, also run `uv pip install ../../../dalaran_py/dalaran_dev_fixup` to
# install the .pth shim that makes `import dalaran` resolve to the editable source tree.
#
# Standalone users (e.g. sparse-checkout of just this example) run instead:
#   uv sync --no-sources --no-dev
# That ignores the path source below and resolves `dalaran-sdk` from PyPI.
# dalaran-dev-fixup is intentionally absent from this file: uv 0.7.x resolves all
# dependency groups and extras unconditionally, so any path-only package here would
# block standalone `--no-sources` resolution.
[tool.uv.sources]
dalaran-sdk = { path = "../../../dalaran_py", editable = true }

# Merged onto the shared base at `../_isolated/mypy.ini` by
# scripts/ci/isolated_examples.py — list the untyped third-party libs this
# example actually imports.
[[tool.mypy.overrides]]
module = ["lerobot.*", "torch.*", "torchvision.*", "diffusers.*", "accelerate.*"]
ignore_missing_imports = true
