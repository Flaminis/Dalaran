[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dalaran-dev-fixup"
version = "0.1.0"
description = "Development helper for dalaran-sdk editable installs"
requires-python = ">=3.10"
dependencies = ["sitecustomize-entrypoints"]

[project.entry-points."sitecustomize"]
dalaran-dev = "dalaran_dev_fixup:init"

[tool.hatch.build.targets.wheel]
packages = ["dalaran_dev_fixup"]

[tool.hatch.build.targets.wheel.force-include]
"dalaran_sdk_fixup.pth" = "dalaran_sdk_fixup.pth"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "dalaran_sdk_fixup.pth" }]
