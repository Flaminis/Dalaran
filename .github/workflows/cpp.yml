# C++ SDK build.
#
# We configure `dalaran_cpp` stand-alone rather than through the top-level
# `CMakeLists.txt`: the top-level project also wires up `dalaran_c`, which shells
# out to `cargo build` and would turn this into a full Rust build. Building the
# `dalaran_sdk` library target compiles every header and translation unit of the
# C++ SDK, which is what we want to guard against here.

name: C++

on:
  push:
    branches: [main]
    paths:
      - "dalaran_cpp/**"
      - "CMakeLists.txt"
      - ".github/workflows/cpp.yml"
  pull_request:
    branches: [main]
    paths:
      - "dalaran_cpp/**"
      - "CMakeLists.txt"
      - ".github/workflows/cpp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    name: Build the C++ SDK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libssl-dev \
            ninja-build \
            pkg-config

      # Arrow is built from source by `download_and_build_arrow.cmake`, which is
      # by far the most expensive part of the build, so it is worth caching.
      - name: Cache the CMake build directory
        uses: actions/cache@v4
        with:
          path: build
          key: cpp-${{ runner.os }}-${{ hashFiles('dalaran_cpp/CMakeLists.txt', 'dalaran_cpp/download_and_build_arrow.cmake') }}
          restore-keys: |
            cpp-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -G Ninja \
            -S dalaran_cpp \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DDALARAN_DOWNLOAD_AND_BUILD_ARROW=ON

      - name: Build
        run: cmake --build build --config Release --target dalaran_sdk --parallel 2
