[workspace]
resolver = "2"
members = [
  "crates/build/*",
  "crates/store/*",
  "crates/top/*",
  "crates/utils/*",
  "crates/viewer/*",
  "docs/snippets",
  "examples/rust/*",
  "dalaran_py",
  "run_wasm",
  "tests/rust/log_benchmark",
  "tests/rust/plot_dashboard_stress",
  "tests/rust/dl_integration_test",
  "tests/rust/test_*",
]
exclude = ["examples/rust/revy", "examples/rust/chess_robby_fischer"]

[workspace.package]
authors = ["The Dalaran Project contributors <opensource@dalaran.dev>"]
edition = "2024"
homepage = "https://dalaran.dev"
include = [
  "../../Cargo.lock", # So that users can pass `--locked` to `cargo install dalaran-cli`
  "../../LICENSE",
  "**/*.rs",
  "Cargo.toml",
]
license = "Apache-2.0"
repository = "https://github.com/Flaminis/Dalaran"
rust-version = "1.95"
version = "0.36.0-alpha.1+dev"

[workspace.metadata.cargo-shear]
ignored = [
  # dalaran crates
  "dalaran_c",
  "dl_dev_tools",
  "dalaran-cli",
  "dl_types_builder",
  "dl_protos_builder",
  "dl_renderer_examples",

  # used for specific targets or features
  "profiling",
  "wayland-sys", # only enabled via the `server` feature of `dl_tracing`
  "windows-core",
]
ignored-paths = [
  "docs/snippets/all/**/*.rs", # complains about unlinked files for our codegen input.
]

[workspace.dependencies]
# When using alpha-release, always use exact version, e.g. `version = "=0.x.y-alpha.z"
# This is because we treat alpha-releases as incompatible, but semver doesn't.
# In particular: if we compile dalaran 0.3.0-alpha.0 we only want it to use
# dl_log_types 0.3.0-alpha.0, NOT 0.3.0-alpha.4 even though it is newer and semver-compatible.

