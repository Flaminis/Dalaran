[package]
name = "dl_entity_db"
authors.workspace = true
description = "In-memory storage of Dalaran entities"
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true


[features]
default = []

## Enable some feature only used for tests
testing = []


[dependencies]
dl_arrow_util.workspace = true
dl_byte_size.workspace = true
dl_chunk.workspace = true
dl_chunk_store.workspace = true
dl_format.workspace = true
dl_int.workspace = true
dl_log_channel.workspace = true
dl_log_encoding = { workspace = true, features = ["decoder"] }
dl_log_types.workspace = true
dl_log.workspace = true
dl_mutex.workspace = true
dl_query.workspace = true
dl_sorbet.workspace = true
dl_tracing.workspace = true
dl_types_core.workspace = true
dl_uri.workspace = true

ahash.workspace = true
arrow.workspace = true
document-features.workspace = true
emath.workspace = true
indexmap.workspace = true
itertools.workspace = true
nohash-hasher.workspace = true
poll-promise.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
static_assertions.workspace = true
tap.workspace = true
thiserror.workspace = true
vec1.workspace = true
web-time.workspace = true

[dev-dependencies]
dl_build_info.workspace = true
dl_log_encoding = { workspace = true, features = ["decoder", "encoder"] }

anyhow.workspace = true
insta.workspace = true
similar-asserts.workspace = true

[lib]
bench = false

[[example]]
name = "memory_usage"
path = "examples/memory_usage.rs"
required-features = ["dl_log_encoding/decoder", "dl_log_encoding/encoder"]
