[package]
name = "dl_protos"
authors.workspace = true
description = "Rerun remote gRPC/protobuf API types"
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true


[features]
default = []

# Enable Python integration with `pyo3`.
py = ["dep:pyo3"]


[dependencies]
dl_arrow_util.workspace = true
dl_build_info.workspace = true
dl_byte_size.workspace = true
dl_chunk.workspace = true
dl_grpc_headers.workspace = true
dl_log_types.workspace = true
dl_sorbet.workspace = true
dl_tracing.workspace = true
dl_types_core.workspace = true
dl_tuid.workspace = true

# External
arrow.workspace = true
http.workspace = true
itertools.workspace = true
jiff.workspace = true
lz4_flex.workspace = true
opentelemetry.workspace = true
prost-types.workspace = true
prost.workspace = true
pyo3 = { workspace = true, optional = true }
quiver = { workspace = true, features = ["derive"] }
serde.workspace = true
thiserror.workspace = true
tonic-prost.workspace = true
tower.workspace = true
tracing.workspace = true
url = { workspace = true, features = ["serde"] }

# Native dependencies:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tonic = { workspace = true, default-features = false, features = ["codegen", "transport"] }

# Web dependencies:
[target.'cfg(target_arch = "wasm32")'.dependencies]
tonic = { workspace = true, default-features = false, features = ["codegen"] }

[dev-dependencies]
insta.workspace = true


[lints]
workspace = true
