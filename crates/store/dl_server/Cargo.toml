[package]
name = "dl_server"
authors.workspace = true
description = "A Dalaran server implementation backed by an in-memory store"
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true


[package.metadata.docs.rs]
all-features = true


[package.metadata.cargo-shear]
ignored = [
  "chrono", # enables wasm support for transitive chrono users
  "getrandom", # enables the wasm backend selected by CI RUSTFLAGS
]


[features]
default = []

# TODO(lancedb/lance#3073): lance depends on system protoc, so lance must be an opt-in dependency
## Enable reading in LanceDB files. Required for tables.
lance = ["dep:lance"]

[dependencies]

# Dalaran
dl_async.workspace = true
dl_arrow_util.workspace = true
dl_build_info.workspace = true
dl_byte_size.workspace = true
dl_chunk_store.workspace = true
dl_entity_db.workspace = true
dl_log = { workspace = true, features = ["setup"] }
dl_log_encoding = { workspace = true, features = ["decoder"] }
dl_log_types.workspace = true
dl_protos.workspace = true
dl_sorbet.workspace = true
dl_span.workspace = true
dl_tuid.workspace = true
dl_types_core.workspace = true

# External
ahash.workspace = true
anyhow.workspace = true
arrow.workspace = true
bincode.workspace = true
datafusion.workspace = true
futures.workspace = true
itertools.workspace = true
jiff.workspace = true
nohash-hasher.workspace = true
parking_lot.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true, features = ["compat"] }
tonic.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dl_format.workspace = true
dl_grpc_server.workspace = true

axum.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
http.workspace = true
http-body.workspace = true
lance = { workspace = true, optional = true }
opentelemetry.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-stream = { workspace = true, features = ["net"] }
tonic-web.workspace = true
tower.workspace = true
tower-service.workspace = true
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytes.workspace = true
chrono = { workspace = true, features = ["wasmbind"] }
getrandom = { workspace = true, features = ["wasm_js"] }
percent-encoding.workspace = true
dl_web.workspace = true

[dev-dependencies]
dl_chunk.workspace = true
dl_chunk_store.workspace = true
# `encoder` (decoder comes transitively via dl_chunk_store) lets tests author RRDs
# with and without footers to cross-check store enumeration vs lazy loading.
dl_log_encoding = { workspace = true, features = ["encoder"] }
dl_tuid.workspace = true
ehttp = { workspace = true, features = ["native-async"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
dl_redap_tests.workspace = true
tempfile.workspace = true

[build-dependencies]
dl_build_tools.workspace = true
