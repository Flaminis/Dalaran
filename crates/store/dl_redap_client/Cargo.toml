[package]
name = "dl_redap_client"
authors.workspace = true
description = "Official gRPC client for the Rerun Data Protocol"
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]

default = []

## Enables integration with `dl_perf_telemetry` (OpenTelemetry, Jaeger).
##
## This only works on native.
perf_telemetry = ["dep:dl_perf_telemetry"]

[lints]
workspace = true


[package.metadata.docs.rs]
all-features = true

[package.metadata.rerun.web-test]
redap-server = true


[dependencies]
dl_arrow_util.workspace = true
dl_async.workspace = true
dl_auth = { workspace = true, features = ["oauth"] }
dl_backoff.workspace = true
dl_byte_size.workspace = true
dl_chunk.workspace = true
dl_error.workspace = true
dl_format.workspace = true
dl_log_channel.workspace = true
dl_log_encoding = { workspace = true, features = ["encoder", "decoder"] }
dl_log_types.workspace = true
dl_log.workspace = true
dl_protos.workspace = true
dl_tracing.workspace = true
dl_types_core.workspace = true
dl_uri.workspace = true

ahash.workspace = true
async-trait.workspace = true
arrow.workspace = true
bitflags.workspace = true
ehttp.workspace = true
futures.workspace = true
http.workspace = true
itertools.workspace = true
jiff.workspace = true
opentelemetry.workspace = true
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "trace"] }
quiver.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic-prost.workspace = true
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
url.workspace = true
web-time.workspace = true

# Native dependencies:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dl_perf_telemetry = { workspace = true, optional = true }
http-body.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "fs"] }
tonic = { workspace = true, default-features = false, features = ["transport", "tls-native-roots"] }

# Web dependencies:
[target.'cfg(target_arch = "wasm32")'.dependencies]
tonic-web-wasm-client.workspace = true
tonic = { workspace = true, default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tiny_http.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
dl_log = { workspace = true, features = ["setup"] }
wasm-bindgen-test.workspace = true
web-sys = { workspace = true, features = ["Location", "Window"] }
