[package]
name = "dl_chunk_store"
authors.workspace = true
description = "A storage engine for Dalaran's Chunks"
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true


[features]
default = []

## Enables `parking_lot`'s deadlock detection background thread.
deadlock_detection = ["parking_lot/deadlock_detection"]

[dependencies]
# Dalaran dependencies:
dl_arrow_util.workspace = true
dl_byte_size.workspace = true
dl_chunk.workspace = true
dl_format.workspace = true
dl_int.workspace = true
dl_log = { workspace = true, features = ["setup"] }
dl_log_encoding = { workspace = true, features = ["decoder"] }
dl_log_types.workspace = true
dl_sdk_types.workspace = true
dl_sorbet.workspace = true
dl_tracing.workspace = true
dl_types_core.workspace = true


# External dependencies:
ahash.workspace = true
anyhow.workspace = true
arrow.workspace = true
document-features.workspace = true
futures.workspace = true
indent.workspace = true
itertools.workspace = true
nohash-hasher.workspace = true
parking_lot = { workspace = true, features = ["arc_lock"] }
thiserror.workspace = true
web-time.workspace = true


[dev-dependencies]
dl_format.workspace = true
dl_log_encoding = { workspace = true, features = ["decoder", "encoder"] }
dl_sdk_types = { workspace = true, features = ["testing"] }

anyhow.workspace = true
tempfile.workspace = true
criterion.workspace = true
insta = { workspace = true, features = ["filters"] }
mimalloc.workspace = true
rand = { workspace = true, features = ["std", "std_rng"] }
similar-asserts.workspace = true


[[bench]]
name = "gc"
harness = false
