[package]
name = "rerun"
authors.workspace = true
categories = ["visualization", "computer-vision"]
description = "Log images, point clouds, etc, and visualize them effortlessly"
edition.workspace = true
homepage.workspace = true
include.workspace = true
keywords = ["mesh", "plotting", "point-cloud", "robotics", "visualization"]
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[features]
default = [
  "analytics",
  "importers",
  "dataframe",
  "demo",
  "glam",
  "image",
  "log",
  "map_view",
  "sdk",
  "server",
]

## Support the `rerun auth` command
auth = ["dl_auth/cli", "dep:jiff", "dep:url"]

## Enable anonymized telemetry using our analytics SDK.
analytics = [
  "dep:dl_analytics",
  "dl_crash_handler?/analytics",
  "dl_viewer?/analytics",
  "dl_web_viewer_server?/analytics",
]

## Integration with `clap`.
clap = ["dep:clap"]

## Support for using Rerun's importers directly from the SDK.
##
## See our `log_file` example and <https://www.rerun.io/docs/concepts/logging-and-ingestion/importers/overview>
## for more information.
importers = ["dep:comfy-table", "dep:mcap", "dep:memmap2", "dep:dl_mcap", "dl_sdk?/importers"]

## Access to Rerun's dataframe API and related types.
dataframe = ["dep:dl_dataframe"]

## Demo helpers for examples.
demo = []

## Integration with the [`ecolor`](https://crates.io/crates/ecolor/) crate.
ecolor = ["dl_sdk_types?/ecolor"]

## Add support for some math operations using [`glam`](https://crates.io/crates/glam/).
## Only relevant if feature `sdk` is enabled.
glam = ["dl_sdk_types?/glam", "dl_byte_size/glam"]

## Integration with the [`image`](https://crates.io/crates/image/) crate, plus JPEG support.
image = ["dl_sdk_types?/image"]

## Integration with the [`log`](https://crates.io/crates/log/) crate.
log = ["dep:env_filter", "dep:log"]

## Support the map view.
## This adds a lot of extra dependencies.
map_view = ["dl_viewer?/map_view"]

## Add support for math type conversions using [`mint`](https://crates.io/crates/mint/).
## Only relevant if feature `sdk` is enabled.
mint = ["dl_sdk_types?/mint"]

## Enable faster native video decoding with assembly.
## You need to install [nasm](https://github.com/netwide-assembler/nasm) to compile with this feature.
nasm = ["dl_video/nasm"]

## Support spawning a native viewer and allow to extend the viewer.
## This adds a lot of extra dependencies, so only enable this feature if you need it!
##
## Also enables the `rerun viewer-mcp` command.
native_viewer = ["dep:libc", "dep:dl_viewer", "dep:dl_crash_handler", "dep:dl_viewer_mcp"]

## Enable the in-memory Rerun data server.
oss_server = ["dep:dl_server"]

## Enables integration with `dl_perf_telemetry` (OpenTelemetry, Jaeger).
##
## This only works on native, and only with `TELEMETRY_ENABLED` set.
perf_telemetry = [
  "dep:dl_perf_telemetry",
  "dl_redap_client/perf_telemetry",
  "dl_viewer?/perf_telemetry",
]

## Enables Tracy profiler integration on top of `perf_telemetry`.
##
## This only works on native.
perf_telemetry_tracy = ["perf_telemetry", "dl_perf_telemetry/tracy"]

## Add support for the [`run()`] function, which acts like a main-function for a CLI,
## acting the same as [the `rerun` binary](https://crates.io/crates/rerun-cli).
run = [
  "auth",
  "clap",
  "dep:dl_chunk_store",
  "dep:dl_crash_handler",
  "dep:dl_data_source",
  "dl_log_encoding/decoder",
  "dl_log_encoding/encoder",
  "sdk",
  "unindent",
]

## Embed the Rerun SDK & built-in types and re-export all of their public symbols.
sdk = ["dep:dl_sdk", "dep:dl_sdk_types"]

## Support for running a gRPC server that listens to incoming log messages from a Rerun SDK.
server = ["dep:dl_grpc_server", "dl_sdk/server", "tokio/signal"]

## Support serving a web viewer over HTTP.
##
## Enabling this inflates the binary size quite a bit, since it embeds the viewer wasm.
##
## For faster & easier builds, a pre-built web-views comes bundled with the crate as a Wasm binary.
## Enabling this feature will embed this pre-built web viewer.
##
## However, when building from source in the repository, this feature adds quite a bit
## to the compile time since it requires compiling and bundling the viewer as wasm.
web_viewer = ["server", "dep:dl_web_viewer_server", "dl_sdk?/web_viewer"]


[dependencies]
dl_async.workspace = true
dl_arrow_util.workspace = true
dl_build_info.workspace = true
dl_byte_size.workspace = true
dl_capabilities.workspace = true
dl_chunk.workspace = true
dl_entity_db.workspace = true
dl_error.workspace = true
dl_format.workspace = true
dl_redap_client.workspace = true
dl_log.workspace = true
dl_log_encoding.workspace = true
dl_log_types.workspace = true
dl_memory.workspace = true
dl_protos.workspace = true
dl_quota_channel.workspace = true
dl_log_channel.workspace = true
dl_sorbet.workspace = true
dl_tracing.workspace = true
dl_uri.workspace = true
dl_video.workspace = true

ahash.workspace = true
anyhow.workspace = true
arrow.workspace = true
camino.workspace = true
comfy-table = { workspace = true, optional = true }
crossbeam.workspace = true
document-features.workspace = true
indexmap.workspace = true
indicatif.workspace = true
itertools.workspace = true
memmap2 = { workspace = true, optional = true }
parking_lot.workspace = true
similar-asserts.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
walkdir.workspace = true

# Optional dependencies:
dl_analytics = { workspace = true, optional = true }
dl_auth = { workspace = true, optional = true }
dl_chunk_store = { workspace = true, optional = true }
dl_crash_handler = { workspace = true, optional = true }
dl_data_source = { workspace = true, optional = true }
dl_dataframe = { workspace = true, optional = true }
dl_grpc_server = { workspace = true, optional = true }
dl_mcap = { workspace = true, optional = true }
mcap = { workspace = true, optional = true }
dl_sdk = { workspace = true, optional = true }
dl_server = { workspace = true, optional = true }
dl_sdk_types = { workspace = true, optional = true }
dl_viewer = { workspace = true, optional = true }
dl_viewer_mcp = { workspace = true, optional = true }
dl_web_viewer_server = { workspace = true, optional = true }

env_filter = { workspace = true, optional = true }
log = { workspace = true, optional = true }

# Native dependencies:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
puffin.workspace = true
rayon.workspace = true

# Native, optional:
clap = { workspace = true, optional = true, features = ["derive"] }
jiff = { workspace = true, optional = true }
dl_perf_telemetry = { workspace = true, optional = true }
unindent = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[target.'cfg(target_family = "unix")'.dependencies]
libc = { workspace = true, optional = true }

[build-dependencies]
dl_build_tools.workspace = true


[package.metadata.cargo-shear]
ignored = ["puffin"]
