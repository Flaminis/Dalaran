[package]
name = "dalaran_c"
authors.workspace = true
description = "Dalaran C SDK"
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include = [
  "../../Cargo.lock",
  "../../LICENSE",
  "**/*.c",
  "**/*.h",
  "**/*.rs",
  "Cargo.toml",
]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[lib]
crate-type = ["staticlib"]
name = "dalaran_c"
doctest = false
test = false


[dependencies]
dl_arrow_util.workspace = true
dl_build_info.workspace = true
dl_crash_handler.workspace = true
dl_log = { workspace = true, features = ["setup"] }
dl_sdk = { workspace = true, features = ["importers", "server"] }
dl_video.workspace = true

ahash.workspace = true
arrow = { workspace = true, features = ["ffi"] }
half.workspace = true
infer.workspace = true
itertools.workspace = true
parking_lot.workspace = true

[build-dependencies]
dl_build_tools.workspace = true
