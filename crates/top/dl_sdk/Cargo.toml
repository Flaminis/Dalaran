[package]
name = "dl_sdk"
authors.workspace = true
categories = ["visualization", "computer-vision"]
description = "Dalaran logging SDK"
edition.workspace = true
homepage.workspace = true
include.workspace = true
keywords = ["mesh", "plotting", "point-cloud", "robotics", "visualization"]
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true


[features]
default = []

## Support for using Dalaran's importers directly from the SDK.
##
## See our `log_file` example and <https://www.dalaran.dev/docs/concepts/logging-and-ingestion/importers/overview>
## for more information.
importers = ["dep:dl_importer", "dep:dl_log_channel"]

## Support serving a web viewer over HTTP.
##
## Enabling this inflates the binary size quite a bit, since it embeds the viewer wasm.
##
## For faster & easier builds, a pre-built web-views comes bundled with the crate as a Wasm binary.
## Enabling this feature will embed this pre-built web viewer.
##
## However, when building from source in the repository, this feature adds quite a bit
## to the compile time since it requires compiling and bundling the viewer as wasm.
web_viewer = ["dep:dl_log_channel", "dep:dl_web_viewer_server", "dep:tokio", "dep:webbrowser"]

server = ["dep:dl_grpc_server", "dep:dl_memory", "dep:dl_log_channel", "dep:tokio"]

[dependencies]
dl_lenses_core.workspace = true
dl_build_info.workspace = true
dl_byte_size.workspace = true
dl_chunk.workspace = true
dl_grpc_client.workspace = true
dl_lenses.workspace = true
dl_log_encoding = { workspace = true, features = ["encoder"] }
dl_log_types.workspace = true
dl_log.workspace = true
dl_quota_channel.workspace = true
dl_sdk_types.workspace = true
dl_sorbet.workspace = true
dl_tracing.workspace = true
dl_uri.workspace = true

ahash.workspace = true
const_format.workspace = true
crossbeam.workspace = true
document-features.workspace = true
itertools.workspace = true
nohash-hasher.workspace = true
parking_lot.workspace = true
percent-encoding.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4"] }

# Optional dependencies

dl_importer = { workspace = true, optional = true }
dl_grpc_server = { workspace = true, optional = true }
dl_log_channel = { workspace = true, optional = true }
dl_memory = { workspace = true, optional = true }
dl_web_viewer_server = { workspace = true, optional = true }

tokio = { workspace = true, optional = true }
webbrowser = { workspace = true, optional = true }

# Native unix dependencies:
[target.'cfg(target_family = "unix")'.dependencies]
libc.workspace = true

[dev-dependencies]
dl_async.workspace = true
dl_log = { workspace = true, features = ["setup"] }

arrow.workspace = true
insta.workspace = true
similar-asserts.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }


[build-dependencies]
dl_build_tools.workspace = true
