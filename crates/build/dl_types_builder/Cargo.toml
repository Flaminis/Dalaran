[package]
name = "dl_types_builder"
authors.workspace = true
description = "Generates code for Dalaran's SDKs from flatbuffers definitions."
edition.workspace = true
homepage.workspace = true
include.workspace = true
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true


[package.metadata.docs.rs]
all-features = true


[features]
## Enable puffin profiling.
tracing = ["dl_tracing/server"]


[dependencies]
dl_build_tools.workspace = true
dl_case.workspace = true
dl_error.workspace = true
dl_log = { workspace = true, features = ["setup"] }
dl_quota_channel.workspace = true
dl_tracing.workspace = true

# External
anyhow.workspace = true
camino.workspace = true
crossbeam.workspace = true
colored.workspace = true
flatbuffers.workspace = true
indent.workspace = true
itertools.workspace = true
prettyplease.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
quote.workspace = true
rayon.workspace = true
regex-lite.workspace = true
serde = { workspace = true, features = ["derive"] }
syn = { workspace = true, features = ["extra-traits", "full"] }
tempfile.workspace = true
toml = { workspace = true, features = ["parse", "preserve_order", "serde"] }
unindent.workspace = true
xshell.workspace = true


[dev-dependencies]
insta.workspace = true


[build-dependencies]

# Dalaran
dl_build_tools.workspace = true

# External
xshell.workspace = true
