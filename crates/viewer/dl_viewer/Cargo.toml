[package]
name = "dl_viewer"
authors.workspace = true
description = "The Dalaran viewer"
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include = [
  "../../Cargo.lock",
  "../../LICENSE",
  "**/*.rs",
  "Cargo.toml",
  "data/*",
]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]


[lib]
crate-type = ["cdylib", "rlib"]


[package.metadata.cargo-shear]
ignored = ["wasm-bindgen-futures"] # generated by #[wasm_bindgen] for async functions
ignored-paths = ["data/quick_start_guides/*.rs"]

[features]
default = ["analytics", "map_view"]

## Enable anonymized telemetry using our analytics SDK.
analytics = ["dep:dl_analytics", "dl_ui/analytics"]

## Enable the map view
map_view = ["dep:dl_view_map"]

## Enables integration with `dl_perf_telemetry` (OpenTelemetry, Jaeger).
##
## This only works on native.
perf_telemetry = ["dep:dl_perf_telemetry", "dl_redap_client/perf_telemetry"]

## Enables Tracy profiler integration on top of `perf_telemetry`.
##
## This only works on native.
perf_telemetry_tracy = ["perf_telemetry", "dl_perf_telemetry/tracy"]

testing = ["dep:tokio", "dl_ui/testing", "dl_analytics/testing"]


[dependencies]
# Internal:
dl_async.workspace = true
dl_auth.workspace = true
dl_blueprint_tree.workspace = true
dl_build_info.workspace = true
dl_byte_size.workspace = true
dl_capabilities.workspace = true
dl_chunk_store_ui.workspace = true
dl_chunk_store.workspace = true
dl_chunk.workspace = true
dl_component_fallbacks.workspace = true
dl_component_ui.workspace = true
dl_importer.workspace = true
dl_data_source.workspace = true
dl_data_ui.workspace = true
dl_dataframe_ui.workspace = true
dl_entity_db.workspace = true
dl_error.workspace = true
dl_format.workspace = true
dl_log = { workspace = true, features = ["setup"] }
dl_log_channel.workspace = true
dl_log_encoding = { workspace = true, features = ["decoder", "encoder", "stream_from_http"] }
dl_log_types.workspace = true
dl_memory_view.workspace = true
dl_memory.workspace = true
dl_mutex.workspace = true
dl_protos.workspace = true
dl_query.workspace = true
dl_recording_panel.workspace = true
dl_redap_browser.workspace = true
dl_redap_client.workspace = true
dl_renderer = { workspace = true, default-features = false }
dl_sdk_types.workspace = true
dl_selection_panel.workspace = true
dl_server.workspace = true
dl_sorbet.workspace = true
dl_string_interner.workspace = true
dl_time_panel.workspace = true
dl_tracing = { workspace = true, features = ["server"] }
dl_types_core.workspace = true
dl_ui.workspace = true
dl_uri.workspace = true
dl_video.workspace = true
dl_gamepad.workspace = true
dl_view.workspace = true
dl_view_bar_chart.workspace = true
dl_view_dataframe.workspace = true
dl_view_graph.workspace = true
dl_view_spatial.workspace = true
dl_view_state_timeline.workspace = true
dl_view_tensor.workspace = true
dl_view_text_document.workspace = true
dl_view_text_log.workspace = true
dl_view_time_series.workspace = true
dl_viewer_context.workspace = true
dl_viewport_blueprint.workspace = true
dl_viewport.workspace = true

# Internal (optional):
dl_analytics = { workspace = true, optional = true }
dl_view_map = { workspace = true, optional = true }

# Test dependencies (optional):
tokio = { workspace = true, optional = true }


# External
ahash.workspace = true
anyhow.workspace = true
arrow.workspace = true
bytemuck.workspace = true
camino.workspace = true
crossbeam.workspace = true
eframe = { workspace = true, default-features = false, features = [
  "default_fonts",
  "persistence",
  "wgpu",
] }
egui_plot.workspace = true
egui-wgpu.workspace = true
egui.workspace = true
egui_inspection.workspace = true
ehttp.workspace = true
emath.workspace = true
futures.workspace = true
glam.workspace = true
image = { workspace = true, default-features = false, features = ["png"] }
itertools.workspace = true
jiff.workspace = true
num-traits.workspace = true
parking_lot.workspace = true
rayon.workspace = true
rfd = { workspace = true, features = ["file-handle-inner"] }
ron.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
strum_macros.workspace = true
strum.workspace = true
tap.workspace = true
thiserror.workspace = true
tokio-stream.workspace = true
url.workspace = true
web-time.workspace = true
wgpu.workspace = true

# Native dependencies:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui_kittest.workspace = true
poll-promise = { workspace = true, features = ["tokio"] }
dl_perf_telemetry = { workspace = true, optional = true }
tokio.workspace = true

# web dependencies:
[target.'cfg(target_arch = "wasm32")'.dependencies]
dl_web.workspace = true
js-sys.workspace = true
poll-promise = { workspace = true, features = ["web"] }
wasm-bindgen-futures.workspace = true
# TODO(#8766): `dalaran_js/web-viewer/build-wasm.mjs` is HIGHLY sensitive to changes in `wasm-bindgen`.
#     Whenever updating `wasm-bindgen`, update all three dependency specifications in
#     `Cargo.toml`, `crates/viewer/dl_redap_browser/Cargo.toml`, and
#     `crates/viewer/dl_viewer/Cargo.toml`, and make sure that notebooks still work:
#         See `dalaran_notebook/README.md` for how to run notebooks.
#         Try running a cell which starts a viewer, and then running it again.
#         There should be no errors in the browser console.
#     For details see https://github.com/rerun-io/rerun/issues/8766
wasm-bindgen = "=0.2.126" # ⚠️ read above notice before touching this!
web-sys = { workspace = true, features = [
  "Crypto",
  "File",
  "History",
  "PopStateEvent",
  "Storage",
  "StorageEvent",
  "UrlSearchParams",
  "Window",
] }


[dev-dependencies]
dl_test_context.workspace = true
dl_test_viewport.workspace = true
tempfile.workspace = true
tokio.workspace = true
insta.workspace = true

[build-dependencies]
dl_build_tools.workspace = true
