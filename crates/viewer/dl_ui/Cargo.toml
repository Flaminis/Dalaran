[package]
authors.workspace = true
description = "Dalaran GUI theme and helpers, built around egui"
edition.workspace = true
homepage.workspace = true
license = "(Apache-2.0) AND OFL-1.1"
name = "dl_ui"
publish = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include = [
  "../../Cargo.lock",
  "../../LICENSE",
  "**/*.rs",
  "Cargo.toml",
  "data/*",
]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true


[features]
default = []

## Enable anonymized telemetry using our analytics SDK.
analytics = ["dep:dl_analytics"]

## Enable helpers for testing
testing = ["dep:egui_kittest", "dl_analytics/testing"]

[dependencies]
dl_analytics = { workspace = true, optional = true }
dl_entity_db.workspace = true # syntax-highlighting for InstancePath. TODO(emilk): move InstancePath
dl_error.workspace = true
dl_format.workspace = true
dl_log.workspace = true
dl_log_types.workspace = true # syntax-highlighting for EntityPath
dl_mutex.workspace = true
dl_tracing.workspace = true
dl_uri.workspace = true # for commands that act on a specific server

ahash.workspace = true
anyhow.workspace = true
eframe = { workspace = true, default-features = false, features = ["wgpu"] }
egui_commonmark = { workspace = true, features = ["pulldown_cmark"] }
egui_extras.workspace = true
egui.workspace = true
getrandom.workspace = true
itertools.workspace = true
jiff.workspace = true
num-traits.workspace = true
nucleo-matcher.workspace = true
parking_lot.workspace = true
ron.workspace = true
serde = { workspace = true, features = ["derive"] }
smallvec.workspace = true
strum_macros.workspace = true
strum.workspace = true
url.workspace = true
web-time.workspace = true


egui_kittest = { workspace = true, optional = true }

# Native
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify.workspace = true # Only used with the `hot_reload_design_tokens` feature

# Mac-specific
[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle.workspace = true

# Linux-specific
[target.'cfg(target_os = "linux")'.dependencies]
thiserror.workspace = true
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client", "unstable"] }


[dev-dependencies]
crossbeam.workspace = true
egui_kittest.workspace = true
egui_tiles.workspace = true
dl_quota_channel.workspace = true
rand = { workspace = true, features = ["std", "thread_rng"] }


[build-dependencies]
dl_build_tools.workspace = true
