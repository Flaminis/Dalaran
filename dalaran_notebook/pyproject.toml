[build-system]
requires = ["hatchling", "hatch-jupyter-builder>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "dalaran-notebook"
description = "Implementation helper for running dalaran-sdk in notebooks"
version = "0.36.0-alpha.1+dev"
dependencies = [
  "anywidget",
  "jupyter-ui-poll",
  # ipykernel 7.0.x has a bug that prevents it from sending display data from a different thread.
  "ipykernel != 7.0.*",
]
readme = "README.md"
keywords = ["dalaran", "notebook"]

[[project.authors]]
email = "opensource@dalaran.dev"
name = "Dalaran.io"

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
dev = ["watchfiles", "jupyterlab", "hatch"]
test = ["pytest>=8.0"]

# automatically add the dev feature to the default env (e.g., hatch shell)
[tool.hatch.envs.default]
features = ["dev"]


[tool.hatch.build]
only-packages = true
artifacts = ["src/dalaran_notebook/static/*", "src/dalaran_notebook/error_widget.js"]

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["src/dalaran_notebook/static/widget.js"]
skip-if-exists = ["src/dalaran_notebook/static/widget.js"]
dependencies = ["hatch-jupyter-builder>=0.5.0"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = "npm"
build_cmd = "build"
